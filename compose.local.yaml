name: fate-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fate-platform:local
    restart: unless-stopped
    environment:
      APP_REVISION: local-compose
      PORT: "3000"
      WRANGLER_LOG_LEVEL: warn
      DATABASE_URL: postgresql://${POSTGRES_USER:-fate_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local.env}@postgres:5432/${POSTGRES_DB:-fate}
      DATABASE_POOL_SIZE: "10"
      DATABASE_SSL: disable
      INDEXER_AUTH_TOKEN: ${INDEXER_AUTH_TOKEN:?Set INDEXER_AUTH_TOKEN in local.env}
      NEXT_PUBLIC_SOLANA_CLUSTER: ${NEXT_PUBLIC_SOLANA_CLUSTER:-devnet}
      NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      NEXT_PUBLIC_FATE_PROGRAM_ID: ${NEXT_PUBLIC_FATE_PROGRAM_ID:?Set NEXT_PUBLIC_FATE_PROGRAM_ID in local.env}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      FATE_PROGRAM_ID: ${FATE_PROGRAM_ID:?Set FATE_PROGRAM_ID in local.env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OTEL_SERVICE_NAME: fate-platform
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      AI_MAX_REQUESTS_PER_WALLET_DAY: ${AI_MAX_REQUESTS_PER_WALLET_DAY:-50}
      AI_MAX_TOKENS_PER_WALLET_DAY: ${AI_MAX_TOKENS_PER_WALLET_DAY:-100000}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-30000}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-5}
      AI_INPUT_USD_PER_MILLION_TOKENS: ${AI_INPUT_USD_PER_MILLION_TOKENS:-1.25}
      AI_OUTPUT_USD_PER_MILLION_TOKENS: ${AI_OUTPUT_USD_PER_MILLION_TOKENS:-10}
    ports:
      - 127.0.0.1:${FATE_LOCAL_PORT:-3100}:3000
    volumes:
      - app_state:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend, observability]
    labels:
      fate.local.component: app

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fate}
      POSTGRES_USER: ${POSTGRES_USER:-fate_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local.env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [frontend, backend, observability]
    labels:
      fate.local.component: postgres

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    image: fate-platform:local
    restart: unless-stopped
    command: [node_modules/.bin/tsx, indexer/cli.ts, run]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fate_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local.env}@postgres:5432/${POSTGRES_DB:-fate}
      SOLANA_CLUSTER: ${SOLANA_CLUSTER:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_RPC_URLS: ${SOLANA_RPC_URLS:-https://api.devnet.solana.com}
      COORDINATION_HEALTH_PORT: "9465"
      OTEL_SERVICE_NAME: fate-coordination-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      SOLANA_GENESIS_HASH: ${SOLANA_GENESIS_HASH:-}
      FATE_PROGRAM_ID: ${FATE_PROGRAM_ID:?Set FATE_PROGRAM_ID in local.env}
      INDEXER_POLL_MS: ${INDEXER_POLL_MS:-15000}
      INDEXER_MAX_BACKFILL_PAGES: ${INDEXER_MAX_BACKFILL_PAGES:-100}
      INDEXER_HEALTH_PORT: "9464"
    ports:
      - 127.0.0.1:${INDEXER_HEALTH_PORT:-9464}:9464
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend, observability]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9464/health').then(r=>{if(r.status!==200&&r.status!==503)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    labels:
      fate.local.component: indexer

  coordination-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: fate-platform:local
    restart: unless-stopped
    command: [node_modules/.bin/tsx, worker/coordination-worker.ts]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fate_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local.env}@postgres:5432/${POSTGRES_DB:-fate}
      DATABASE_SSL: disable
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_RPC_URLS: ${SOLANA_RPC_URLS:-https://api.devnet.solana.com}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9465/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [backend, observability]
    labels:
      fate.local.component: coordination-worker

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-fate_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local.env}@postgres:5432/${POSTGRES_DB:-fate}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [observability, backend]

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./deploy/local/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on: [app, postgres-exporter]
    networks: [frontend, observability]

  loki:
    image: grafana/loki:3.5.7
    restart: unless-stopped
    command: [-config.file=/etc/loki/config.yaml]
    ports:
      - 127.0.0.1:${LOKI_PORT:-3101}:3100
    volumes:
      - ./deploy/local/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [frontend, observability]

  tempo:
    image: grafana/tempo:2.7.2
    restart: unless-stopped
    command: [-config.file=/etc/tempo.yaml]
    ports:
      - 127.0.0.1:${TEMPO_PORT:-3200}:3200
    volumes:
      - ./deploy/local/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [frontend, backend, observability]

  alloy:
    image: grafana/alloy:v1.11.3
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy]
    volumes:
      - ./deploy/local/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    depends_on: [loki]
    networks: [observability]

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in local.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    volumes:
      - ./deploy/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]
    networks: [frontend, observability]

networks:
  frontend: {}
  backend:
    internal: true
  observability:
    internal: true

volumes:
  app_state: {}
  postgres_data: {}
  prometheus_data: {}
  loki_data: {}
  tempo_data: {}
  alloy_data: {}
  grafana_data: {}
