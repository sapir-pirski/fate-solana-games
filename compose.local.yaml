name: fate-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fate-platform:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 2.0
    mem_limit: 1g
    environment:
      APP_REVISION: local-compose
      PORT: "3000"
      # Application JSON events are emitted at info; keep them visible so Alloy
      # can normalize them into Loki labels for the local dashboards.
      WRANGLER_LOG_LEVEL: info
      INDEXER_AUTH_TOKEN: ${INDEXER_AUTH_TOKEN:?Set INDEXER_AUTH_TOKEN in local.env}
      # Local fallback keeps existing installations working; production uses a distinct secret.
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN:-${INDEXER_AUTH_TOKEN:?Set INDEXER_AUTH_TOKEN in local.env}}
      RESTORE_MAX_BYTES: ${RESTORE_MAX_BYTES:-10485760}
      RESTORE_MAX_ROWS: ${RESTORE_MAX_ROWS:-10000}
      PRIVACY_REQUEST_DEADLINE_DAYS: ${PRIVACY_REQUEST_DEADLINE_DAYS:-30}
      PRIVACY_EXPORT_TTL_SECONDS: ${PRIVACY_EXPORT_TTL_SECONDS:-604800}
      NEXT_PUBLIC_SOLANA_CLUSTER: ${NEXT_PUBLIC_SOLANA_CLUSTER:-devnet}
      NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      NEXT_PUBLIC_FATE_PROGRAM_ID: ${NEXT_PUBLIC_FATE_PROGRAM_ID:?Set NEXT_PUBLIC_FATE_PROGRAM_ID in local.env}
      NEXT_PUBLIC_COINFLIP_RANDOMNESS_ENDPOINT: ${NEXT_PUBLIC_COINFLIP_RANDOMNESS_ENDPOINT:-}
      NEXT_PUBLIC_COINFLIP_RANDOMNESS_ACCOUNT: ${NEXT_PUBLIC_COINFLIP_RANDOMNESS_ACCOUNT:-}
      NEXT_PUBLIC_DAILY_RANDOMNESS_ENDPOINT: ${NEXT_PUBLIC_DAILY_RANDOMNESS_ENDPOINT:-}
      NEXT_PUBLIC_DAILY_RANDOMNESS_ACCOUNT: ${NEXT_PUBLIC_DAILY_RANDOMNESS_ACCOUNT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OTEL_SERVICE_NAME: fate-platform
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      AI_MAX_REQUESTS_PER_WALLET_DAY: ${AI_MAX_REQUESTS_PER_WALLET_DAY:-50}
      AI_MAX_TOKENS_PER_WALLET_DAY: ${AI_MAX_TOKENS_PER_WALLET_DAY:-100000}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-30000}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-5}
      AI_INPUT_USD_PER_MILLION_TOKENS: ${AI_INPUT_USD_PER_MILLION_TOKENS:-1.25}
      AI_OUTPUT_USD_PER_MILLION_TOKENS: ${AI_OUTPUT_USD_PER_MILLION_TOKENS:-10}
    ports:
      - 127.0.0.1:${FATE_LOCAL_PORT:-3100}:3000
    volumes:
      - app_state:/data
    networks: [frontend, observability]
    labels:
      fate.local.component: app

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./deploy/local/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on: [app]
    networks: [frontend, observability]

  loki:
    image: grafana/loki:3.5.7
    restart: unless-stopped
    command: [-config.file=/etc/loki/config.yaml]
    ports:
      - 127.0.0.1:${LOKI_PORT:-3101}:3100
    volumes:
      - ./deploy/local/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [frontend, observability]

  tempo:
    image: grafana/tempo:2.7.2
    restart: unless-stopped
    command: [-config.file=/etc/tempo.yaml]
    ports:
      - 127.0.0.1:${TEMPO_PORT:-3200}:3200
    volumes:
      - ./deploy/local/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [frontend, observability]

  alloy:
    image: grafana/alloy:v1.11.3
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy]
    volumes:
      - ./deploy/local/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    depends_on: [loki]
    networks: [observability]

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in local.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana 12 otherwise tries TraceQL over gRPC against Tempo's HTTP
      # listener and the datasource query fails before the panel can render.
      GF_FEATURE_TOGGLES_TRACEQLSTREAMING: "false"
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    volumes:
      - ./deploy/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]
    networks: [frontend, observability]

networks:
  frontend: {}
  observability:
    internal: true

volumes:
  app_state: {}
  prometheus_data: {}
  loki_data: {}
  tempo_data: {}
  alloy_data: {}
  grafana_data: {}
