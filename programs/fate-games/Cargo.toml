[package]
name = "fate-games"
version = "0.1.0"
description = "Provably fair Solana game settlement program"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "fate_games"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.1.2"
switchboard-on-demand = "=0.11.3"
