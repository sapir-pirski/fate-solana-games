name: Devnet acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://fate-solana-games.sapirp.chatgpt.site
      SOLANA_RPC_URL: https://api.devnet.solana.com
      FATE_PROGRAM_ID: Fg6PaFpoGXkYsidMpWxqSWY4vF8zqRkMnJx9QpMvdWvZ
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:unit
      - name: Verify live devnet deployment gates
        run: npm run test:acceptance | tee devnet-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devnet-acceptance-evidence-${{ github.run_id }}
          path: devnet-acceptance.json
          retention-days: 90

  rust-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
