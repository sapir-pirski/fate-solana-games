name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:unit
      - run: node scripts/check-bundle-budget.mjs

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: fate_test
          POSTGRES_USER: fate_test
          POSTGRES_PASSWORD: fate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fate_test -d fate_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://fate_test:fate_test@127.0.0.1:5432/fate_test
      DATABASE_SSL: disable
      NEXT_PUBLIC_SOLANA_CLUSTER: devnet
      NEXT_PUBLIC_FATE_PROGRAM_ID: Fg6PaFpoGXkYsidMpWxqSWY4vF8zqRkMnJx9QpMvdWvZ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:integration

  browser-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env: { POSTGRES_DB: fate_test, POSTGRES_USER: fate_test, POSTGRES_PASSWORD: fate_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fate_test -d fate_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://fate_test:fate_test@127.0.0.1:5432/fate_test
      DATABASE_SSL: disable
      NEXT_PUBLIC_SOLANA_CLUSTER: devnet
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      NEXT_PUBLIC_FATE_PROGRAM_ID: Fg6PaFpoGXkYsidMpWxqSWY4vF8zqRkMnJx9QpMvdWvZ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:contract
      - run: npm run test:browser
      - run: npm run test:accessibility
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-artifacts, path: test-results/playwright }

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
