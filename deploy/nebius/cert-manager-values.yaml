crds:
  enabled: true
prometheus:
  enabled: true
nodeSelector:
  workload: fate
tolerations:
  - key: workload
    operator: Equal
    value: fate
    effect: NoSchedule
webhook:
  nodeSelector:
    workload: fate
  tolerations:
    - key: workload
      operator: Equal
      value: fate
      effect: NoSchedule
cainjector:
  nodeSelector:
    workload: fate
  tolerations:
    - key: workload
      operator: Equal
      value: fate
      effect: NoSchedule
