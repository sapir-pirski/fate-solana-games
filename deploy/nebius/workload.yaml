apiVersion: apps/v1
kind: Deployment
metadata:
  name: fate-web
  namespace: fate
  labels: &labels
    app.kubernetes.io/name: fate-web
    app.kubernetes.io/part-of: fate-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fate-web
  template:
    metadata:
      labels: *labels
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      nodeSelector:
        workload: fate
      tolerations:
        - key: workload
          operator: Equal
          value: fate
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fate-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: FATE_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: fate-config }
            - secretRef: { name: fate-secrets }
          env:
            - name: APP_REVISION
              value: FATE_REVISION
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fate-web
  namespace: fate
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fate-web
---
apiVersion: v1
kind: Service
metadata:
  name: fate-web
  namespace: fate
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: fate-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fate-web
  namespace: fate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fate-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fate-web
  namespace: fate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fate-web
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - {}
