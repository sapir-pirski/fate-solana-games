apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fate-letsencrypt
spec:
  acme:
    email: FATE_TLS_EMAIL
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: fate-letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fate-web
  namespace: fate
  annotations:
    cert-manager.io/cluster-issuer: fate-letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [FATE_HOST]
      secretName: fate-web-tls
  rules:
    - host: FATE_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fate-web
                port:
                  number: 80
