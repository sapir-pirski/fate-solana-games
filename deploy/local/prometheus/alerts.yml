groups:
  - name: fate-local
    rules:
      - alert: FateApplicationDown
        expr: up{job="fate-app"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: FATE local application is unavailable
          impact: Wallet and game API requests are unavailable.
          runbook_url: https://github.com/fate/runbooks#application-down
      - alert: FateD1MetricsUnavailable
        expr: fate_database_metrics_available == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: FATE D1 application database is unavailable
          impact: Durable wallet, game, and transaction state cannot be read.
          runbook_url: https://github.com/fate/runbooks#d1-unavailable
      - alert: FateD1LatencyHigh
        expr: fate_database_operation_duration_ms_sum{backend="d1"} / clamp_min(fate_database_operation_duration_ms_count{backend="d1"}, 1) > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: FATE D1 operation latency is elevated
          impact: Wallet sessions and game API requests may respond slowly.
          runbook_url: https://github.com/fate/runbooks#d1-latency
      - alert: FateApplicationErrorRateHigh
        expr: sum(rate(fate_errors_total[5m])) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: FATE application error rate is elevated
          impact: One or more user workflows may be failing.
          runbook_url: https://github.com/fate/runbooks#application-errors
      - alert: FateAiProviderLatencyHigh
        expr: fate_ai_provider_duration_ms_sum / clamp_min(fate_ai_provider_duration_ms_count, 1) > 15000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: FATE Copilot provider latency is elevated
          impact: AI assistance may time out while gameplay remains available.
          runbook_url: https://github.com/fate/runbooks#ai-provider-latency
      - alert: FateRateLimitRejectionsHigh
        expr: sum(rate(fate_rate_limit_decisions_total{decision="rejected"}[5m])) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: FATE is rejecting an elevated volume of requests
          impact: Legitimate wallets may experience temporary throttling.
          runbook_url: https://github.com/fate/runbooks#rate-limits
      - alert: FateTransactionRecoveryBacklog
        expr: fate:transaction_stuck:count > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Transaction recovery backlog is elevated
          impact: Wallet transaction finality may be delayed.
          runbook_url: https://github.com/fate/runbooks#transaction-recovery
      - alert: FateTransactionConfirmationDeadLetters
        expr: sum(fate_queue_jobs{queue="transaction-confirmation",status="dead"}) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Transaction confirmations reached their retry limit
          impact: One or more wallet operations require manual reconciliation.
          runbook_url: https://github.com/fate/runbooks#transaction-confirmation-dead-letters
      - alert: FateTransactionConfirmationStalled
        expr: max(fate_queue_oldest_age_seconds{queue="transaction-confirmation",status=~"pending|running"}) > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Transaction confirmation processing is stalled
          impact: Submitted wallet transactions are not reaching final state promptly.
          runbook_url: https://github.com/fate/runbooks#transaction-confirmation-stalled
      - alert: FateSolanaRpcUnavailable
        expr: fate_solana_rpc_providers_available < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: No Solana RPC provider is available
          impact: Indexing and transaction confirmation cannot advance.
          runbook_url: https://github.com/fate/runbooks#solana-rpc
      - alert: FateSolanaRpcLatencyHigh
        expr: fate_solana_rpc_latency_ms > 5000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Solana RPC latency is elevated
          impact: Game state and confirmations may be delayed.
          runbook_url: https://github.com/fate/runbooks#solana-rpc-latency
      - alert: FateTelemetryMissing
        expr: absent(fate_build_info)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Application telemetry is missing
          impact: Operational visibility is incomplete.
          runbook_url: https://github.com/fate/runbooks#telemetry-missing
