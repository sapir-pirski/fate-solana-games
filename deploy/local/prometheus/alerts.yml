groups:
  - name: fate-local
    rules:
      - alert: FateApplicationDown
        expr: up{job="fate-app"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: FATE local application is unavailable
          impact: Wallet and game API requests are unavailable.
          runbook_url: https://github.com/fate/runbooks#application-down
      - alert: FateDatabaseExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: FATE local PostgreSQL exporter is unavailable
          impact: Database health and capacity are unknown.
          runbook_url: https://github.com/fate/runbooks#postgres
      - alert: FateIndexerDown
        expr: up{job="fate-indexer"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: FATE Solana indexer is unavailable
          impact: Finalized game history will stop advancing.
          runbook_url: https://github.com/fate/runbooks#indexer-down
      - alert: FateIndexerFinalizedLag
        expr: fate_indexer_finalized_lag > 500
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: FATE Solana indexer is more than 500 finalized slots behind
          impact: Users may see stale finalized game state.
          runbook_url: https://github.com/fate/runbooks#indexer-lag
      - alert: FateIndexerDeadLetters
        expr: fate_indexer_dead_letters > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: FATE Solana indexer has unresolved dead-letter records
          impact: One or more chain transactions could not be indexed.
          runbook_url: https://github.com/fate/runbooks#indexer-dead-letters
      - alert: FateCoordinationWorkerDown
        expr: up{job="fate-coordination"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Transaction recovery worker is unavailable
          impact: Submitted transaction confirmation recovery is paused.
          runbook_url: https://github.com/fate/runbooks#coordination-worker
      - alert: FateTransactionRecoveryBacklog
        expr: fate:transaction_stuck:count > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Transaction recovery backlog is elevated
          impact: Wallet transaction finality may be delayed.
          runbook_url: https://github.com/fate/runbooks#transaction-recovery
      - alert: FateQueueOldestJob
        expr: max(fate_queue_oldest_age_seconds{status=~"pending|retry|running"}) > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: A background job has been waiting over five minutes
          impact: Confirmation or cleanup work is delayed.
          runbook_url: https://github.com/fate/runbooks#queue-backlog
      - alert: FateQueueDeadLetters
        expr: sum(fate_queue_jobs{status="dead"}) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Background jobs entered the dead-letter state
          impact: Automated recovery exhausted all retry attempts.
          runbook_url: https://github.com/fate/runbooks#queue-dead-letter
      - alert: FateSolanaRpcUnavailable
        expr: fate_solana_rpc_providers_available < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: No Solana RPC provider is available
          impact: Indexing and transaction confirmation cannot advance.
          runbook_url: https://github.com/fate/runbooks#solana-rpc
      - alert: FateSolanaRpcLatencyHigh
        expr: fate_solana_rpc_latency_ms > 5000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Solana RPC latency is elevated
          impact: Game state and confirmations may be delayed.
          runbook_url: https://github.com/fate/runbooks#solana-rpc-latency
      - alert: FatePostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / clamp_min(sum(pg_settings_max_connections), 1) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: PostgreSQL connection utilization is high
          impact: API and worker queries may begin failing.
          runbook_url: https://github.com/fate/runbooks#postgres-connections
      - alert: FateTelemetryMissing
        expr: absent(fate_build_info)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Application telemetry is missing
          impact: Operational visibility is incomplete.
          runbook_url: https://github.com/fate/runbooks#telemetry-missing
