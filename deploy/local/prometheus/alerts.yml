groups:
  - name: fate-local
    rules:
      - alert: FateApplicationDown
        expr: up{job="fate-app"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: FATE local application is unavailable
      - alert: FateDatabaseExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: FATE local PostgreSQL exporter is unavailable
      - alert: FateRedisExporterDown
        expr: up{job="redis"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: FATE local Redis exporter is unavailable
