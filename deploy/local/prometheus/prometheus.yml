global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: fate-app
    metrics_path: /api/metrics
    static_configs:
      - targets: ["app:3000"]
  - job_name: fate-indexer
    metrics_path: /metrics
    static_configs:
      - targets: ["indexer:9464"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
